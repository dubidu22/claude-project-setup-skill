schema_version: "1.1"
name: audit-asked-to-fix
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The user asks for a check and, in the same breath, for the problems to be fixed. The assistant runs the audit
  (audit_rules.py and the semantic checklist) and reports the most serious findings with both rule ids and
  exact replacement text. It changes nothing: governance/claude-project-rules.yaml, governance/project-state.yaml
  and CLAUDE.md are byte-for-byte unchanged, and it does not run the generator. It explains in a sentence or two
  that the audit is read-only and how the fixes get applied (the owner approves the edits as a pull request, or
  the ruleset is migrated onto the generator with init), and asks which the owner wants.
