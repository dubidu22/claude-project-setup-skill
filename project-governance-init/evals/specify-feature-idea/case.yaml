schema_version: "1.1"
name: specify-feature-idea
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The assistant treats the input as a new feature, does not stall on interview questions, researches
  budget-alert and CLI error behaviour on the web and opens the pages it cites. It writes a new draft
  acceptance contract under governance/plans/ that lints with zero errors: a goal sentence, binary
  criteria with verify steps covering input validation and error states besides the happy path,
  research sources with https URLs and retrieval dates, its own guesses marked as assumptions, an
  end-to-end core probe, every must and should criterion in exactly one of a few work packages
  labelled with lane labels from the ruleset, and cut items in the cut list rather than as could
  criteria. The contract stays in status draft with empty approval. governance/roadmap.yaml gains a
  budget-alerts milestone placed before the PDF export, status planned, and passes the roadmap check.
  No GitHub issue is created; issue drafts are only listed or saved as a file. The rules file is
  untouched. The final message is a hand-back the owner can decide from: the owner view of the contract
  (every must and should criterion with its verify step, scope, hash), assumptions, cut items, roadmap
  before and after, issue titles, and the request to approve by quoting the hash.
