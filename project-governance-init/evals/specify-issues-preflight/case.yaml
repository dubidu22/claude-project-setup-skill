schema_version: "1.1"
name: specify-issues-preflight
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The assistant runs contract_tool.py issues with --preflight for the approved contract C-002 before creating
  anything, and reads plans/issues-C-002.json through the tool: the work package "budgets" already has issue 31
  for this version, so it is skipped, and only the backlog item from the cut list is still to create. It needs
  the labels and milestone to exist; because it has no confirmed GitHub access in this session it creates
  nothing, does not guess, saves the remaining draft as governance/plans/issues-C-002.md and says so. It does
  not create a second issue for the package, does not edit or close issue 31, does not create labels or
  milestones itself, and does not change the contract. The final message says what exists, what is still to
  create and what the owner has to do.
