contract:
  id: C-002
  title: "Budget alerts on import"
  milestone: "v0.2"
  version: 1
  status: approved

goal: "When I import transactions, the CLI warns me about every category that is over its monthly budget."
users: "only the owner"
access: "CLI on macOS and Ubuntu"
constraints:
  - "transaction data and budgets never leave the machine"
out_of_scope:
  - "notifications outside the terminal"
  - "budgets per week or per year"

criteria:
  - id: AC-1
    text: "With budget 200 for 'food' in budgets.toml and 250 imported for food in 2026-10, `ledgerlite import` prints one warning line naming food, 250 and 200"
    priority: must
    category: happy_path
    verify: {type: test, how: "pytest tests/test_budget.py::test_over_budget_warns"}
    source: {kind: owner, ref: "feature idea 2026-11-12"}
  - id: AC-2
    text: "A category at or below its budget prints no warning line"
    priority: must
    category: happy_path
    verify: {type: test, how: "pytest tests/test_budget.py::test_within_budget_silent"}
    source: {kind: owner, ref: "feature idea 2026-11-12"}
  - id: AC-3
    text: "A budgets.toml with a negative or non-numeric budget exits with code 2 and names the category"
    priority: must
    category: input_validation
    verify: {type: command, how: "ledgerlite import tests/fixtures/bank.csv --budgets tests/fixtures/bad_budgets.toml exits 2 and prints 'food'"}
    source: {kind: research, ref: "https://clig.dev/#errors", retrieved: 2026-11-12}
  - id: AC-4
    text: "Without a budgets.toml the import runs as before and exits 0"
    priority: must
    category: error_states
    verify: {type: test, how: "pytest tests/test_budget.py::test_no_budget_file"}
    source: {kind: owner, ref: "feature idea 2026-11-12"}
  - id: AC-5
    text: "`ledgerlite import --help` documents the --budgets option"
    priority: should
    category: operability
    verify: {type: command, how: "ledgerlite import --help prints '--budgets'"}
    source: {kind: research, ref: "https://clig.dev/#help", retrieved: 2026-11-12}

core_probe: "Fresh clone, follow README, import tests/fixtures/bank.csv with the sample budgets.toml, one warning line for 'food' appears"

work_packages:
  - {key: budgets, title: "Budget file and over-budget warning", label: "lane:cli", criteria: [AC-1, AC-2, AC-3, AC-4, AC-5]}

cut:
  - {text: "Coloured warning output", reason: "not needed to prove the goal"}

research:
  categories_skipped:
    - "data_persistence: budgets are read from a file, nothing new is stored"
    - "security_privacy: local single-user tool, no network"
    - "accessibility: CLI only, plain text output"
    - "performance: fixture-sized data"
    - "platform: CI runs ubuntu and macos"
    - "licences_dependencies: tomllib is in the standard library"
  notes: ""

approval:
  by: owner
  date: 2026-11-13
  hash: c21a6cc9c189
  owner_message: "2026-11-13: approved c21a6cc9c189"

changes: []
