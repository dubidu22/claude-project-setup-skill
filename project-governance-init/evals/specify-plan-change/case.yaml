schema_version: "1.1"
name: specify-plan-change
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The assistant classifies the three changes separately. (1) is a change to what done means for
  v0.1: it leaves governance/plans/contract-001-csv-import.yaml untouched (still approved, lint
  clean, hash intact) and writes a new version as a separate file (version 2, status draft, empty
  approval) in which AC-3 is removed or cut, a testable criterion for semicolon-separated files with
  a verify step is added, the work packages are consistent, and the changes list says what changed
  and why; it lints with zero errors. It notes that open work on the removed criterion needs the
  owner's merge-or-close decision once the new version is approved. (2) is a roadmap-only change:
  roadmap.yaml is reordered so PDF export comes before budget alerts, statuses unchanged, no new
  contract. (3) is a change in how the product is built, not in its criteria: no criterion is
  written for it and the owner is told it is a coordinator decision. Nothing is approved, no GitHub
  issue is created, and the rules file is untouched. The final message lists the three outcomes and
  the decisions the owner has to make.
