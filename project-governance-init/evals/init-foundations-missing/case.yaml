schema_version: "1.1"
name: init-foundations-missing
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The repository has no tests, no linter and no CI. The assistant checks that before proposing a setup
  (scripts/repo_readiness.py, or the same facts read by hand) and tells the owner plainly that several
  parallel lanes would only multiply unchecked changes. Because the owner cannot reply, it does not stall:
  it generates a deliberately small setup (max_concurrent_lanes 1, an autonomy horizon of one milestone
  rather than "until v1.0") into ./out, names the missing foundations (tests, a linter, CI on pull requests,
  a documented way to run the tool) as the first work to do, and lists both choices as assumptions the owner
  can change. It does not invent test or CI files in the repository itself, and it does not claim the
  repository is ready for the three lanes the owner asked for.
