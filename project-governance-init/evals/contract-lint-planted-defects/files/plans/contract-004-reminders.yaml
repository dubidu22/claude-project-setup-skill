contract:
  id: C-004
  title: "Reminders"
  milestone: v0.3
  version: 2
  status: approved

goal: "I get a reminder on my phone before each task's due time."
users: only the owner
access: web app, phone browser

out_of_scope:
  - "recurring tasks"

criteria:
  - id: AC-1
    text: "A task with a due time gets a reminder 30 minutes before it, by default"
    priority: must
    category: happy_path
    verify: {type: test, how: "pytest tests/test_reminders.py::test_default_offset"}
    source: {kind: owner, ref: "interview, milestone kickoff"}
  - id: AC-2
    text: "Reminders are sent reliably"
    priority: must
    category: operability
    verify: {type: manual, how: "check on phone over a week"}
    source: {kind: owner, ref: "interview, milestone kickoff"}
  - id: AC-3
    text: "Changing a task's due time reschedules its pending reminder"
    priority: must
    category: data_persistence
    verify: {type: test, how: "pytest tests/test_reminders.py::test_reschedule"}
    source: {kind: repo, ref: "src/tasks/models.py"}
  - id: AC-3
    text: "Deleting a task cancels its pending reminder"
    priority: must
    category: data_persistence
    verify: {type: test, how: "pytest tests/test_reminders.py::test_cancel_on_delete"}
    source: {kind: repo, ref: "src/tasks/models.py"}
  - id: AC-5
    text: "Notification permission is requested only after the user turns reminders on, not on page load"
    priority: must
    category: security_privacy
    verify: {type: manual, how: "owner opens the app on a fresh phone profile"}
    source: {kind: research, ref: "https://web.dev/articles/push-notifications-permissions-ux"}
  - id: AC-6
    text: "Notification text shows the task title and due time, at most 120 characters"
    priority: should
    category: happy_path
    verify: {type: test, how: "pytest tests/test_reminders.py::test_text_length"}
    source: {kind: research, ref: "Apple Human Interface Guidelines"}
  - id: AC-7
    text: "Reminders can be snoozed for 10 minutes from the notification"
    priority: could
    category: happy_path
    verify: {type: manual, how: "owner taps snooze on the phone"}
    source: {kind: owner, ref: "interview, milestone kickoff"}
  - id: AC-8
    text: "A reminder that cannot be delivered is retried 3 times, 1 minute apart, then logged"
    priority: must
    category: error_states
    verify: {type: manual, how: "owner turns the phone offline and back on"}
    source: {kind: assumption, ref: ""}

research:
  categories_skipped: []
  notes: ""

approval:
  by: coordinator
  date: 2026-11-17
  decision: ""

changes: []
