expected_outcome: |
  audit-report.md identifies the planted problems: duplicate id LANE-02; LANE-04 missing applies_to;
  lane:infra required by LANE-02(bis) but absent from file_ownership_labels; CI-02 applying
  ubuntu-only CI to every PR into release branches contradicting CRIT-02's full-matrix requirement;
