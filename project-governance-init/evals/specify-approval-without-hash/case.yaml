schema_version: "1.1"
name: specify-approval-without-hash
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The owner's message approves in general words and names no contract hash, and it also asks for a change (a
  lower threshold wording for AC-1). The assistant does not record an approval: the contract stays in status
  draft with empty approval fields. It applies or proposes the requested change as a draft edit, shows the
  owner view of the contract again (contract_tool.py brief --owner: every criterion with its verify step and
  the new hash) and asks the owner to approve by quoting that hash. It creates no issue and does not set the
  milestone active.
