schema_version: "1.1"
name: change-settings-economy
context:
  scaffold_script: place-files.sh
expected_outcome: |
  The assistant does not rerun the setup walkthrough. It changes the two settings through the
  generator (model_preset economy, profile_key frugal) on the existing governance-config.json,
  so governance/claude-project-rules.yaml now routes routine implementation and review to Sonnet,
  carries the frugal token numbers and contains the escalation rule, while lanes, owner data and
  invariants are unchanged. governance/project-state.yaml keeps its live values (slow_down true,
  the two open owner steps) and the review ledger keeps its entry. The generated instruction files
  are refreshed and the rules pass the mechanical audit with zero errors. The final message lists
  in plain words what changed (models per slot, the main token numbers, rules added) and what the
  owner does next: tell the coordinator to re-read the rules, running threads keep their model
  until replaced, and compare review rounds per PR after the next batch.
