# Acceptance contract for {{project_name}}
# Copy to plans/contract-<NNN>-<slug>.yaml (a later version: ...-v<N>.yaml), fill in, then run:
#   python3 tools/contract_tool.py lint plans/contract-<NNN>-<slug>.yaml
# Method: tools/acceptance-contracts.md (rules ROLE-10, PLAN-03 to PLAN-05, REV-03).

contract:
  id: C-001
  title: "<milestone or feature name>"
  milestone: "<e.g. v0.1>"
  version: 1
  status: draft              # draft | approved | superseded

goal: "<one sentence a stranger could check, e.g. 'I can import my bank CSV and see a monthly total per category.'>"

users: "<only the owner | named people | public>"
access: "<CLI | browser | phone | desktop app, and which OS>"

constraints:
  - "<hard limits: budget, data that must stay local, deadlines>"

out_of_scope:
  - "<what this version deliberately does not do>"

criteria:
  - id: AC-1
    text: "<one observable, binary statement>"
    priority: must           # must | should | could (could items leave before approval)
    category: happy_path     # see references/acceptance-contracts.md section 5
    verify:
      type: test             # test | command | runtime | inspection | manual
      how: "<test name, or command and expected result>"
    source:
      kind: owner            # owner | research | repo | assumption
      ref: "<interview answer, URL, or file path>"
      # retrieved: YYYY-MM-DD   (required when kind is research)

core_probe: "<the one end-to-end check that proves the goal sentence from a fresh clone>"

work_packages:               # one package = one thread, one PR, one review round; every must/should criterion in exactly one
  - key: wp1
    title: "<what this package delivers>"
    label: "{{first_label}}"     # one file-ownership label from the ruleset (lint checks it)
    criteria: [AC-1]         # about six at most; split by what can be built and reviewed on its own
    # after: [other-key]     # only if this package cannot start before another one is merged

cut: []                      # could items that left the contract: {text: "...", reason: "..."} -> backlog issues

research:
  categories_skipped: []     # e.g. ["accessibility: no UI in this milestone"]
  notes: ""

approval:                    # filled in by the specify thread, only on the owner's own message
  by: ""                     # must be "owner" once status is approved
  date: ""                   # YYYY-MM-DD
  hash: ""                   # output of `contract_tool.py hash`; covers goal, users, access, constraints, out_of_scope, core probe, criteria
  owner_message: ""          # the owner's approval message, quoted; it must contain the hash
# After approval nobody edits this file. The coordinator records "<id> v<version> D-<n> hash <hash>" in
# approved_contracts of project-state.yaml on pickup; lint compares the contract with that record.

changes: []                  # version history: "v2: AC-4 threshold 300 ms -> 500 ms (D-0xx)"
